name: preflight

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci` (not `npm install`) — it installs strictly from the lockfile and
      # starts from an empty node_modules. `npm install` against a lockfile that
      # has drifted from package.json triggers npm's optional-dependency bug
      # (npm/cli#4828): rollup's platform binary (@rollup/rollup-linux-x64-gnu)
      # is silently skipped, so vitest dies at startup with "Cannot find module
      # @rollup/rollup-<platform>" and the step exits 1.
      - run: npm ci --no-audit --no-fund
      - name: Type check & build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Verify showcase
        run: npm run verify
