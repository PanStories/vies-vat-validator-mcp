name: preflight

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Type check & build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Verify showcase
        run: npm run verify
